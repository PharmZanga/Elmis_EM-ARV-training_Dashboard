services:
  - type: web
    name: elmis-training-dashboard
    runtime: static
    repo: https://github.com/PharmZanga/Elmis_EM-ARV-training_Dashboard
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
